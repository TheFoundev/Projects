spring.application.name=traccar
server.port=${PORT:8080}

# Default: in-memory H2, zero setup so `mvn spring-boot:run` works immediately.
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:mem:traccar;DB_CLOSE_DELAY=-1;MODE=PostgreSQL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.datasource.driver-class-name=${SPRING_DATASOURCE_DRIVER:org.h2.Driver}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

spring.jackson.serialization.write-dates-as-timestamps=false
management.endpoints.web.exposure.include=health,info
