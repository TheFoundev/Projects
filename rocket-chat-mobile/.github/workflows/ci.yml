name: CI

on:
  push:
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install the dependencies
        run: npm install
      - name: Type check
        run: npm run typecheck
      - name: Run the tests
        run: npm test
