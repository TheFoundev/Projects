{% extends "base.html" %}
{% block content %}
<div class="card">
  <h1>{{ resource.label }} #{{ item.id }}</h1>
  <dl class="kv">
    {% for f in resource.fields %}<dt>{{ f.label or f.name }}</dt><dd>{{ item[f.name] if item[f.name] is not none else '—' }}</dd>{% endfor %}
    <dt>Created</dt><dd>{{ item.created_at }}</dd>
  </dl>
  {% if user %}<a class="btn primary" style="margin-top:16px" href="{{ url_for('resource_edit', name=resource.name, item_id=item.id) }}">Edit</a>{% endif %}
  <a class="btn" style="margin-top:16px" href="{{ url_for('resource_list', name=resource.name) }}">Back</a>
</div>
{% endblock %}
