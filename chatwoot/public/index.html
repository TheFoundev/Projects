<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#0f172a" />
  <title>Chatwoot</title>
  <link rel="stylesheet" href="/style.css" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='22' fill='#1f93ff'/><text x='50' y='68' font-size='54' text-anchor='middle' fill='white' font-family='sans-serif'>C</text></svg>" />
</head>
<body>
  <div id="app" class="app-shell">
    <aside class="sidebar">
      <a class="brand" href="#/">
        <span class="brand-mark">C</span>
        <span><strong>Chatwoot</strong><small>Every support conversation in one inbox</small></span>
      </a>
      <nav id="nav" class="nav" aria-label="Main navigation"></nav>
      <div class="sidebar-foot">
        <div id="user-box"></div>
        <p class="muted small">Chatwoot · Foundev</p>
      </div>
    </aside>
    <main class="main">
      <header class="topbar">
        <button class="icon-btn only-mobile" id="menu-btn" aria-label="Toggle navigation">☰</button>
        <div>
          <h1 id="page-title">Dashboard</h1>
          <p id="page-subtitle" class="muted">Every support conversation in one inbox</p>
        </div>
        <div id="top-actions" class="row gap"></div>
      </header>
      <section id="view" class="view" aria-live="polite"></section>
    </main>
  </div>
  <div id="modal-root"></div>
  <div id="toast" class="toast" role="status"></div>
  <script src="/app.js"></script>
</body>
</html>
