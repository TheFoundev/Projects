apiVersion: apps/v1
kind: Deployment
metadata:
  name: crapi
spec:
  replicas: 1
  selector:
    matchLabels:
      app: crapi
  template:
    metadata:
      labels:
        app: crapi
    spec:
      containers:
        - name: crapi
          image: foundev/crapi:0.1.0
          ports:
            - containerPort: 8080
          env:
            - name: SPRING_PROFILES_ACTIVE
              value: practice
