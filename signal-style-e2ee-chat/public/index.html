<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Signal-style chat demo</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 640px; margin: 2rem auto; padding: 0 1rem; }
    fieldset { border: 1px solid #ccc; margin-bottom: 1rem; }
    #log { height: 240px; overflow-y: auto; border: 1px solid #ccc; padding: 0.5rem; }
    #log p { margin: 0.25rem 0; }
  </style>
</head>
<body>
  <h1>Signal-style chat demo</h1>
  <p>Messages are encrypted in this tab and relayed as opaque envelopes.</p>
  <fieldset>
    <legend>Connection</legend>
    <label>Name <input id="name" value="guest"></label>
    <label>Room passphrase <input id="passphrase" type="password" value="change-me"></label>
    <button id="connect">Connect</button>
    <span id="status">offline</span>
  </fieldset>
  <fieldset>
    <legend>Messages</legend>
    <div id="log"></div>
    <label>Message <input id="message" placeholder="type a message"></label>
    <button id="send" disabled>Send</button>
  </fieldset>
  <script src="/app.js"></script>
</body>
</html>
