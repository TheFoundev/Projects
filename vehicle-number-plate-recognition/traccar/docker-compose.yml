services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: traccar
      POSTGRES_USER: traccar
      POSTGRES_PASSWORD: traccar
    ports:
      - "5432:5432"
    volumes:
      - traccar-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U traccar -d traccar"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build: .
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/traccar
      SPRING_DATASOURCE_USERNAME: traccar
      SPRING_DATASOURCE_PASSWORD: traccar
      SPRING_DATASOURCE_DRIVER: org.postgresql.Driver
      SPRING_PROFILES_ACTIVE: docker
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy

volumes:
  traccar-data:
